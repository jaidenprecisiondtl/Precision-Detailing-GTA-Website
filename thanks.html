<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booking Request Received | Precision Detailing</title>
<meta name="description" content="Your booking request has been received. Precision Detailing will follow up the same day.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* Page-specific: center the confirmation card in the viewport */
  body { padding-bottom: 0; display: flex; align-items: center; min-height: 100vh; }
  .thanks {
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    padding: var(--s-5) 20px;
  }
  .thanks .check {
    width: 68px; height: 68px;
    margin: 0 auto var(--s-3);
    border-radius: 50%;
    border: 2px solid var(--blue);
    position: relative;
  }
  .thanks .check::before {
    content: "";
    position: absolute;
    top: 46%; left: 50%;
    width: 24px; height: 12px;
    border-left: 3px solid var(--blue);
    border-bottom: 3px solid var(--blue);
    transform: translate(-50%, -50%) rotate(-45deg);
  }
  .thanks p { color: var(--text-muted); }
  .thanks .btn { margin-top: var(--s-3); }
</style>
</head>
<body>

  <div class="thanks">
    <div class="check" aria-hidden="true"></div>

    <p class="eyebrow">Request Received</p>
    <h1 style="font-size:clamp(1.8rem,6vw,2.6rem)">You are on the list.</h1>

    <p>
      Thanks for booking with Precision Detailing. You will hear back the same day
      with a confirmed time and a final quote.
    </p>

    <p>
      Remember, a <strong style="color:var(--blue)">$20 deposit</strong> locks in your slot
      and comes off your total.
    </p>

    <p>
      Need it sooner? Call or text
      <a href="tel:+14165647698">(416) 564-7698</a>.
    </p>

    <a class="btn btn-primary" href="/">Back to the Site</a>
  </div>

</body>
</html>
